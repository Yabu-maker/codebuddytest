<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记事本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 15% 25%, rgba(255, 107, 107, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 75%, rgba(72, 219, 251, 0.18) 0%, transparent 60%);
            animation: bgShift 14s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgShift {
            0%   { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.06) rotate(2deg); }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 顶栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            color: #fff;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: #ff6b6b;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            backdrop-filter: blur(6px);
        }

        .btn-danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        /* 编辑器区域 */
        .editor {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .editor-title {
            width: 100%;
            padding: 8px 0 12px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            outline: none;
            background: transparent;
            color: #1a1a2e;
        }

        .editor-title::placeholder { color: #bbb; }

        .editor-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .editor-body {
            width: 100%;
            min-height: 180px;
            max-height: 400px;
            padding: 4px 0;
            font-size: 15px;
            line-height: 1.7;
            border: none;
            outline: none;
            resize: vertical;
            background: transparent;
            color: #333;
        }

        .editor-body::placeholder { color: #bbb; }

        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eee;
        }

        .char-count {
            margin-left: auto;
            font-size: 12px;
            color: #aaa;
            align-self: center;
        }

        /* 便签列表 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .note-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .note-card .note-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-card .note-preview {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-card .note-time {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }

        .note-card .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.04);
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .note-card:hover .delete-btn {
            display: flex;
        }

        .note-card .delete-btn:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .note-card.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.25);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
            grid-column: 1 / -1;
        }

        .empty-state .icon {
            font-size: 50px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 15px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .editor { padding: 16px; }
            .notes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>📝 记<span>事</span>本</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="newNote()">＋ 新建</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑 清空</button>
            </div>
        </div>

        <div class="editor" id="editor">
            <input class="editor-title" id="noteTitle" placeholder="标题" maxlength="50">
            <div class="editor-meta">
                <span id="noteDate">未保存</span>
                <span id="noteId" style="color:#ddd;font-family:monospace;"></span>
            </div>
            <textarea class="editor-body" id="noteBody" placeholder="开始写点什么..." oninput="updateCharCount()"></textarea>
            <div class="editor-actions">
                <button class="btn btn-primary" onclick="saveNote()">💾 保存</button>
                <button class="btn btn-danger" onclick="deleteCurrent()">🗑 删除</button>
                <span class="char-count" id="charCount">0 字</span>
            </div>
        </div>

        <div class="notes-grid" id="notesGrid"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== 数据 ==========
        let notes = [];
        let currentId = null;

        // ========== 本地存储 ==========
        function loadNotes() {
            try {
                const raw = localStorage.getItem('notepad_notes');
                notes = raw ? JSON.parse(raw) : [];
            } catch { notes = []; }
        }

        function saveNotes() {
            localStorage.setItem('notepad_notes', JSON.stringify(notes));
        }

        // ========== 便签操作 ==========
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function getNow() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function findNote(id) {
            return notes.find(n => n.id === id);
        }

        function newNote() {
            currentId = null;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteBody').value = '';
            document.getElementById('noteDate').textContent = '新笔记';
            document.getElementById('noteId').textContent = '';
            updateCharCount();
            document.getElementById('noteTitle').focus();
            renderNotes();
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim() || '无标题';
            const body = document.getElementById('noteBody').value.trim();

            if (!body) {
                showToast('请输入内容');
                return;
            }

            const now = getNow();

            if (currentId && findNote(currentId)) {
                // 更新
                const note = findNote(currentId);
                note.title = title;
                note.body = body;
                note.updatedAt = now;
            } else {
                // 新建
                const note = {
                    id: generateId(),
                    title,
                    body,
                    createdAt: now,
                    updatedAt: now,
                };
                notes.unshift(note);
                currentId = note.id;
            }

            saveNotes();
            renderNotes();
            showToast('已保存');

            // 更新编辑器中的 ID 显示
            if (currentId) {
                document.getElementById('noteId').textContent = `#${currentId.slice(0, 8)}`;
            }
            document.getElementById('noteDate').textContent = now;
        }

        function deleteNote(id) {
            if (!confirm('确定删除这条笔记？')) return;
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            if (currentId === id) newNote();
            else renderNotes();
            showToast('已删除');
        }

        function deleteCurrent() {
            if (!currentId) return;
            deleteNote(currentId);
        }

        function clearAll() {
            if (!notes.length) return;
            if (!confirm('确定清空所有笔记？此操作不可恢复！')) return;
            notes = [];
            saveNotes();
            newNote();
            showToast('已清空');
        }

        function selectNote(id) {
            const note = findNote(id);
            if (!note) return;
            currentId = note.id;
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteBody').value = note.body;
            document.getElementById('noteDate').textContent = note.updatedAt;
            document.getElementById('noteId').textContent = `#${note.id.slice(0, 8)}`;
            updateCharCount();
            renderNotes();
        }

        // ========== 渲染 ==========
        function renderNotes() {
            const grid = document.getElementById('notesGrid');

            if (!notes.length) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">📄</div><p>还没有笔记，点击右上角「新建」开始</p></div>';
                return;
            }

            grid.innerHTML = notes.map(n => {
                const active = n.id === currentId ? 'active' : '';
                const preview = n.body.replace(/\n/g, ' ').slice(0, 80) + (n.body.length > 80 ? '...' : '');
                return `
                    <div class="note-card ${active}" onclick="selectNote('${n.id}')">
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteNote('${n.id}')">✕</button>
                        <div class="note-title">${escapeHtml(n.title)}</div>
                        <div class="note-preview">${escapeHtml(preview)}</div>
                        <div class="note-time">${n.updatedAt}</div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateCharCount() {
            const len = document.getElementById('noteBody').value.length;
            document.getElementById('charCount').textContent = `${len} 字`;
        }

        // ========== Toast 提示 ==========
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ========== 快捷键 ==========
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveNote();
            }
        });

        // ========== 启动 ==========
        loadNotes();
        if (notes.length) {
            selectNote(notes[0].id);
        } else {
            newNote();
        }
    </script>
</body>
</html>
