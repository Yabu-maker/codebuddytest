<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 380px;
            max-width: 90vw;
        }

        .login-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input.error {
            border-color: #e74c3c;
        }

        .form-group input.error:focus {
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
        }

        .form-group input.valid {
            border-color: #27ae60;
        }

        .field-error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .form-options label {
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-options a {
            color: #667eea;
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #888;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-title">欢迎回来</div>
        <div class="login-subtitle">请登录您的账号</div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入邮箱或用户名" autocomplete="username">
                <div class="field-error" id="usernameError">请输入邮箱或用户名</div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码（至少 6 位）" autocomplete="current-password">
                <div class="field-error" id="passwordError">密码不能少于 6 位</div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" checked> 记住我
                </label>
                <a href="#">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn">登 录</button>
        </form>

        <div class="login-footer">
            还没有账号？<a href="#">立即注册</a>
        </div>
    </div>

    <script>
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        function showError(el, msg) {
            el.textContent = msg;
            el.style.display = 'block';
        }

        function hideError(el) {
            el.style.display = 'none';
        }

        function setState(input, state) {
            input.classList.remove('error', 'valid');
            if (state) input.classList.add(state);
        }

        function validateUsername() {
            const val = username.value.trim();
            if (!val) {
                showError(usernameError, '账号不能为空');
                setState(username, 'error');
                return false;
            }
            hideError(usernameError);
            setState(username, 'valid');
            return true;
        }

        function validatePassword() {
            const val = password.value;
            if (!val) {
                showError(passwordError, '密码不能为空');
                setState(password, 'error');
                return false;
            }
            if (val.length < 6) {
                showError(passwordError, '密码不能少于 6 位');
                setState(password, 'error');
                return false;
            }
            hideError(passwordError);
            setState(password, 'valid');
            return true;
        }

        // 实时校验：失焦时触发
        username.addEventListener('blur', validateUsername);
        password.addEventListener('blur', validatePassword);

        // 输入时清除错误状态
        username.addEventListener('input', () => {
            hideError(usernameError);
            setState(username, username.value.trim() ? 'valid' : '');
        });
        password.addEventListener('input', () => {
            hideError(passwordError);
            setState(password, password.value ? 'valid' : '');
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const isUsernameValid = validateUsername();
            const isPasswordValid = validatePassword();

            if (!isUsernameValid || !isPasswordValid) return;

            console.log('登录请求:', {
                username: username.value.trim(),
                password: password.value,
            });
            alert('登录成功（演示）');
        });
    </script>
</body>
</html>
